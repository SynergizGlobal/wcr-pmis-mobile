name: wcr_pmis_mobile
description: "IMPACT-WCR — West Central Railway Project Management Information System."
publish_to: 'none'
version: 1.0.3+5

environment:
  sdk: ^3.11.4

dependencies:
  cached_network_image: ^3.4.1
  cookie_jar: ^4.0.8
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.0
  dio_cookie_manager: ^3.3.0
  excel: ^4.0.6
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  file_picker: ^10.1.9
  freezed_annotation: ^2.4.4
  geocoding: ^3.0.0
  geolocator: ^13.0.2
  image_picker: ^1.2.1
  open_file: ^3.5.11
  path: ^1.9.1
  pdfx: ^2.6.0
  permission_handler: ^12.0.1
  printing: ^5.13.2
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^16.0.0
  in_app_review: ^2.0.10
  intl: ^0.20.2
  json_annotation: ^4.9.0
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  pretty_dio_logger: ^1.4.0
  riverpod_annotation: ^2.6.1
  share_plus: ^11.0.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0
  firebase_core: ^4.9.0
  firebase_crashlytics: ^5.2.2
  firebase_remote_config: ^6.5.2
  firebase_messaging: ^16.4.3
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.5.4
  freezed: ^2.5.7
  riverpod_generator: ^2.6.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/update_forms_icons/
    - assets/dashboard_slides/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon.png
  remove_alpha_ios: true
